site_name: 'Enterprise GCP DevOps & SRE Platform'
site_description: 'Production-ready reference architecture, manifests, scripts and pipelines for a GCP enterprise DevOps/SRE platform'
site_author: 'Platform SRE Team'
repo_url: 'https://github.com/AravindKumarjoshi/devops-platform'
site_url: 'https://AravindKumarjoshi.github.io/devops-platform/'


theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    primary: indigo
    accent: cyan
  font:
    text: Roboto
    code: Roboto Mono

nav:
  - Home: index.md
  - Architecture Diagrams: architecture-diagrams.md
  - Jenkins on GKE Manifests: jenkins-gke-manifests.md
  - SRE Automation Scripts: sre-automation-scripts.md
  - Golden Image Pipeline: golden-image-pipeline.md
  - Observability & Monitoring: observability-monitoring.md

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

extra_css:
  - stylesheets/extra.css

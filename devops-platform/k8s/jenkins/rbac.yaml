apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jenkins-controller-role
  labels:
    app.kubernetes.io/name: jenkins
    environment: production
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jenkins-controller-role-binding
  labels:
    app.kubernetes.io/name: jenkins
    environment: production
subjects:
  - kind: ServiceAccount
    name: jenkins-controller
    namespace: jenkins-prod
roleRef:
  kind: ClusterRole
  name: jenkins-controller-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-agent-management-role
  namespace: jenkins-agents
  labels:
    app.kubernetes.io/name: jenkins
    environment: production
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec", "pods/log"]
    verbs: ["get", "list", "watch", "create", "delete", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-agent-management-role-binding
  namespace: jenkins-agents
  labels:
    app.kubernetes.io/name: jenkins
    environment: production
subjects:
  - kind: ServiceAccount
    name: jenkins-controller
    namespace: jenkins-prod
roleRef:
  kind: Role
  name: jenkins-agent-management-role
  apiGroup: rbac.authorization.k8s.io

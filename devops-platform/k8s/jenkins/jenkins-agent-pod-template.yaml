apiVersion: v1
kind: ConfigMap
metadata:
  name: jenkins-agent-pod-templates
  namespace: jenkins-prod
  labels:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/component: agent-templates
data:
  pod-templates.yaml: |
    jenkins:
      clouds:
        - kubernetes:
            name: "gke-cluster"
            serverUrl: "https://kubernetes.default"
            namespace: "jenkins-agents"
            templates:
              - name: "kaniko-agent"
                label: "kaniko"
                namespace: "jenkins-agents"
                serviceAccount: "jenkins-agent"
                containers:
                  - name: "jnlp"
                    image: "jenkins/inbound-agent:3256.v88a_f6e922152-1"
                    imagePullPolicy: "Always"
                  - name: "kaniko"
                    image: "gcr.io/kaniko-project/executor:v1.23.0"
                    imagePullPolicy: "Always"
                    command: "/busybox/cat"
                    ttyEnabled: true
                volumes:
                  - secretVolume:
                      secretName: "kaniko-secret"
                      mountPath: "/kaniko/.docker/"
              - name: "maven-agent"
                label: "maven"
                namespace: "jenkins-agents"
                serviceAccount: "jenkins-agent"
                containers:
                  - name: "jnlp"
                    image: "jenkins/inbound-agent:3256.v88a_f6e922152-1"
                    imagePullPolicy: "Always"
                  - name: "maven"
                    image: "maven:3.9.8-eclipse-temurin-17"
                    imagePullPolicy: "Always"
                    command: "cat"
                    ttyEnabled: true
                volumes:
                  - emptyDirVolume:
                      memory: false
                      mountPath: "/root/.m2/repository"
              - name: "nodejs-agent"
                label: "nodejs"
                namespace: "jenkins-agents"
                serviceAccount: "jenkins-agent"
                containers:
                  - name: "jnlp"
                    image: "jenkins/inbound-agent:3256.v88a_f6e922152-1"
                    imagePullPolicy: "Always"
                  - name: "node"
                    image: "node:20.17.0-bullseye-slim"
                    imagePullPolicy: "Always"
                    command: "cat"
                    ttyEnabled: true
              - name: "sonarscanner-agent"
                label: "sonar"
                namespace: "jenkins-agents"
                serviceAccount: "jenkins-agent"
                containers:
                  - name: "jnlp"
                    image: "jenkins/inbound-agent:3256.v88a_f6e922152-1"
                    imagePullPolicy: "Always"
                  - name: "sonar-scanner"
                    image: "sonarsource/sonar-scanner-cli:11"
                    imagePullPolicy: "Always"
                    command: "cat"
                    ttyEnabled: true
                    envVars:
                      - secretEnvVar:
                          key: "SONAR_HOST_URL"
                          secretName: "sonar-secret"
                          secretKey: "host-url"
                      - secretEnvVar:
                          key: "SONAR_TOKEN"
                          secretName: "sonar-secret"
                          secretKey: "token"
              - name: "terraform-agent"
                label: "terraform"
                namespace: "jenkins-agents"
                serviceAccount: "jenkins-agent"
                containers:
                  - name: "jnlp"
                    image: "jenkins/inbound-agent:3256.v88a_f6e922152-1"
                    imagePullPolicy: "Always"
                  - name: "terraform"
                    image: "hashicorp/terraform:1.9.5"
                    imagePullPolicy: "Always"
                    command: "cat"
                    ttyEnabled: true

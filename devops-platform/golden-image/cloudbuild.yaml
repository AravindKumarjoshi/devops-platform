steps:
  - id: 'validate-packer'
    name: 'hashicorp/packer:1.11.0'
    args: ['version']

  - id: 'init-packer-plugins'
    name: 'hashicorp/packer:1.11.0'
    args: ['init', 'golden-image/packer.pkr.hcl']

  - id: 'packer-validate'
    name: 'hashicorp/packer:1.11.0'
    args: ['validate', 'golden-image/packer.pkr.hcl']

  - id: 'packer-lint-ansible'
    name: 'cytopia/ansible-lint'
    args: ['golden-image/ansible-playbook.yaml']

  - id: 'packer-build-rhel9'
    name: 'hashicorp/packer:1.11.0'
    args:
      - 'build'
      - '-var'
      - 'build_number=${_BUILD_NUMBER}'
      - '-var'
      - 'git_commit_sha=${_GIT_SHA}'
      - '-var'
      - 'source_image_family=rhel-9'
      - '-var'
      - 'image_family=enterprise-rhel9-base'
      - 'golden-image/packer.pkr.hcl'
    env:
      - 'PACKER_LOG=1'
    timeout: 3600s

  - id: 'packer-build-debian12'
    name: 'hashicorp/packer:1.11.0'
    args:
      - 'build'
      - '-var'
      - 'build_number=${_BUILD_NUMBER}'
      - '-var'
      - 'git_commit_sha=${_GIT_SHA}'
      - '-var'
      - 'source_image_family=debian-12'
      - '-var'
      - 'image_family=enterprise-debian12-base'
      - 'golden-image/packer.pkr.hcl'
    env:
      - 'PACKER_LOG=1'
    timeout: 3600s

  - id: 'notify-slack-success'
    name: 'gcr.io/cloud-builders/curl'
    args:
      - '-X'
      - 'POST'
      - '-H'
      - 'Content-type: application/json'
      - '--data'
      - '{"text":"✅ Golden Image Build ${_BUILD_NUMBER} completed successfully for sha ${_GIT_SHA}."}'
      - '${_SLACK_WEBHOOK_URL}'

  - id: 'update-servicenow-cmdb'
    name: 'gcr.io/cloud-builders/curl'
    args:
      - '-X'
      - 'POST'
      - '-H'
      - 'Accept: application/json'
      - '-H'
      - 'Content-Type: application/json'
      - '-H'
      - 'Authorization: Bearer ${_SNOW_TOKEN}'
      - '--data'
      - '{"build_number": "${_BUILD_NUMBER}", "commit_sha": "${_GIT_SHA}", "status": "SUCCESS"}'
      - 'https://${_SNOW_INSTANCE}.service-now.com/api/now/table/cmdb_ci_cloud_image'

substitutions:
  _BUILD_NUMBER: 'latest'
  _GIT_SHA: 'unknown'
  # NOTE: _SLACK_WEBHOOK_URL and _SNOW_TOKEN must be passed at trigger time.
  # Never store real values here. Use Secret Manager + Cloud Build secrets:
  #   gcloud builds submit --substitutions _SLACK_WEBHOOK_URL=$$SLACK_WEBHOOK
  # Or configure them in the Cloud Build trigger UI under "Substitution variables".
  _SLACK_WEBHOOK_URL: ''
  _SNOW_INSTANCE: 'enterprise'
  _SNOW_TOKEN: ''

# Sensitive values fetched from Secret Manager at build time
availableSecrets:
  secretManager:
    - versionName: 'projects/$PROJECT_ID/secrets/slack-webhook-url/versions/latest'
      env: 'SLACK_WEBHOOK_URL'
    - versionName: 'projects/$PROJECT_ID/secrets/servicenow-api-token/versions/latest'
      env: 'SNOW_API_TOKEN'

serviceAccount: 'projects/$PROJECT_ID/serviceAccounts/packer-builder@enterprise-images.iam.gserviceaccount.com'
logsBucket: 'gs://enterprise-images-build-logs'
timeout: 3600s
options:
  machineType: 'E2_HIGHCPU_8'
